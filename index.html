<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天室</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #f0f4ff, #e8fff4);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .chat-box {
        width: 90%;
        max-width: 700px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .chat-header {
        padding: 18px 20px;
        background: #4f46e5;
        color: white;
        font-size: 20px;
        font-weight: bold;
      }

      .chat-messages {
        height: 420px;
        overflow-y: auto;
        padding: 18px 20px;
        background: #f9fafb;
      }

      .message {
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
      }

      .message.self {
        align-items: flex-end;
      }

      .message-content {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      .message.self .message-content {
        background: #4f46e5;
        color: white;
      }

      .message.other .message-content {
        background: #e5e7eb;
        color: #111827;
      }

      .sender {
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 4px;
      }

      .message.self .sender {
        text-align: right;
      }

      .chat-input {
        display: flex;
        gap: 10px;
        padding: 16px 20px;
        background: white;
        border-top: 1px solid #e5e7eb;
      }

      #messageInput {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
      }

      #messageInput:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
      }

      button {
        border: none;
        background: #4f46e5;
        color: white;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="chat-box">
      <div class="chat-header">在线聊天室</div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-input">
        <input id="messageInput" type="text" placeholder="输入消息并按回车发送..." maxlength="200" />
        <button id="sendBtn">发送</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

      function appendMessage(text, sender, isSelf = false) {
        const wrap = document.createElement('div');
        wrap.className = `message ${isSelf ? 'self' : 'other'}`;

        const senderEl = document.createElement('div');
        senderEl.className = 'sender';
        senderEl.textContent = sender;

        const contentEl = document.createElement('div');
        contentEl.className = 'message-content';
        contentEl.textContent = text;

        wrap.appendChild(senderEl);
        wrap.appendChild(contentEl);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        const payload = {
          sender: '我',
          text
        };

        socket.emit('chat message', payload);
        appendMessage(text, '我', true);
        inputEl.value = '';
        inputEl.focus();
      }

      sendBtn.addEventListener('click', sendMessage);

      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });

      socket.on('chat message', (data) => {
        const senderName = data.sender || '系统';
        const text = data.text || '';
        appendMessage(text, senderName, senderName === '我');
      });

      appendMessage('欢迎来到聊天室！', '系统', false);
    </script>
  </body>
</html>
