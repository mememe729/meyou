<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多人实时聊天室</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-box {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .chat-header {
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      color: white;
      padding: 18px 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .chat-content {
      height: 480px;
      overflow-y: auto;
      padding: 16px;
      background: #f9fafb;
    }

    .msg {
      display: flex;
      margin-bottom: 14px;
    }

    .msg.me {
      justify-content: flex-end;
    }

    .msg.other {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .msg.other .bubble {
      background: #e5e7eb;
      color: #111827;
    }

    .msg.me .bubble {
      background: #2f80ed;
      color: white;
    }

    .name {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 4px;
      display: block;
    }

    .input-area {
      display: flex;
      padding: 14px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    #msg-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 15px;
      outline: none;
    }

    #msg-input:focus {
      border-color: #2f80ed;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
    }

    #send-btn {
      margin-left: 10px;
      border: none;
      background: #2f80ed;
      color: white;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
    }

    #send-btn:hover {
      background: #1f6fe5;
    }

    .nick-popup {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .nick-box {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      width: 320px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    }

    .nick-box h3 {
      margin-bottom: 18px;
      color: #111827;
    }

    #nickname {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      outline: none;
    }

    #nickname:focus {
      border-color: #2f80ed;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
    }

    #confirmNick {
      margin-top: 16px;
      border: none;
      background: #2f80ed;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    #confirmNick:hover {
      background: #1f6fe5;
    }
  </style>
</head>
<body>
  <div class="nick-popup" id="nickPopup">
    <div class="nick-box">
      <h3>请输入你的昵称</h3>
      <input id="nickname" type="text" placeholder="例如：阿明" maxlength="12" />
      <button id="confirmNick">进入聊天室</button>
    </div>
  </div>

  <div class="chat-box" id="chatContainer" style="display:none;">
    <div class="chat-header">多人实时聊天室</div>
    <div class="chat-content" id="chatWrap"></div>
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="输入消息，按回车发送" />
      <button id="send-btn">发送</button>
    </div>
  </div>

  <script>
    const socket = io();
    const chatWrap = document.getElementById('chatWrap');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const nickPopup = document.getElementById('nickPopup');
    const chatContainer = document.getElementById('chatContainer');
    const nicknameInput = document.getElementById('nickname');

    let myNickName = '';

    function addMessage(nick, text, isMine = false) {
      const msg = document.createElement('div');
      msg.className = `msg ${isMine ? 'me' : 'other'}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = nick;

      const content = document.createElement('div');
      content.textContent = text;

      bubble.appendChild(name);
      bubble.appendChild(content);
      msg.appendChild(bubble);
      chatWrap.appendChild(msg);

      chatWrap.scrollTop = chatWrap.scrollHeight;
    }

    function sendMessage() {
      const txt = input.value.trim();
      if (!txt || !myNickName) return;

      addMessage(myNickName, txt, true);
      socket.emit('chat message', { nick: myNickName, msg: txt });
      input.value = '';
      input.focus();
    }

    document.getElementById('confirmNick').addEventListener('click', () => {
      const nick = nicknameInput.value.trim();
      if (!nick) {
        alert('昵称不能为空！');
        return;
      }
      myNickName = nick;
      nickPopup.style.display = 'none';
      chatContainer.style.display = 'block';
      input.focus();
    });

    nicknameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('confirmNick').click();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    socket.on('chat message', (data) => {
      if (!data || !data.nick) return;
      const isMine = data.nick === myNickName;
      addMessage(data.nick, data.msg || '', isMine);
    });
  </script>
</body>
</html>
