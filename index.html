<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人实时聊天室</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f0f2f5;display:flex;justify-content:center;padding:20px}
        .chat-box{width:100%;max-width:460px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ddd}
        .chat-header{background:#2486ff;color:#fff;padding:16px;text-align:center;font-weight:bold;font-size:18px}
        .chat-content{height:520px;padding:16px;overflow-y:auto;background:#fafafa}
        .msg{margin-bottom:14px;display:flex}
        .msg.other{justify-content:flex-start}
        .msg.me{justify-content:flex-end}
        .bubble{padding:10px 15px;border-radius:18px;max-width:75%;word-wrap:break-word;font-size:15px}
        .other .bubble{background:#e5e7eb;color:#111}
        .me .bubble{background:#2486ff;color:#fff}
        .input-area{display:flex;padding:14px;border-top:1px solid #eee}
        #msg-input{flex:1;padding:11px;border:1px solid #ddd;border-radius:24px;outline:none;font-size:15px}
        #send-btn{margin-left:10px;padding:0 20px;background:#2486ff;color:#fff;border:none;border-radius:24px;cursor:pointer;font-size:15px}
        .nick-popup{
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);
            display:flex;align-items:center;justify-content:center;
        }
        .nick-box{background:white;padding:30px;border-radius:12px;text-align:center}
        #nickname{padding:10px;width:240px;font-size:16px;border:1px solid #ccc;border-radius:8px}
        #confirmNick{margin-top:14px;padding:9px 22px;background:#2486ff;color:white;border:none;border-radius:8px;cursor:pointer}
    </style>
</head>
<body>
<div class="nick-popup" id="nickPopup">
    <div class="nick-box">
        <h3>请输入你的昵称</h3>
        <br>
        <input id="nickname" placeholder="例如：阿明">
        <br>
        <button id="confirmNick">进入聊天室</button>
    </div>
</div>

<div class="chat-box" id="chatContainer" style="display:none;">
    <div class="chat-header">多人实时聊天室</div>
    <div class="chat-content" id="chatWrap"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="输入消息，回车发送">
        <button id="send-btn">发送</button>
    </div>
</div>

<script>
const socket = io();
const chatWrap = document.getElementById('chatWrap');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const nickPopup = document.getElementById('nickPopup');
const chatContainer = document.getElementById('chatContainer');

let myNickName = "";

document.getElementById("confirmNick").onclick = function(){
    const nick = document.getElementById("nickname").value.trim();
    if(!nick){
        alert("昵称不能为空！");
        return;
    }
    myNickName = nick;
    nickPopup.style.display = "none";
    chatContainer.style.display = "block";
}

function addMsg(nick, text, isMine) {
    const div = document.createElement('div');
    div.className = `msg ${isMine ? 'me' : 'other'}`;
    div.innerHTML = `<div class="bubble"><b>${nick}</b>：${text}</div>`;
    chatWrap.appendChild(div);
    chatWrap.scrollTop = chatWrap.scrollHeight;
}

function sendMessage(){
    const txt = input.value.trim();
    if(!txt) return;
    addMsg(myNickName,txt,true);
    socket.emit('chat message', {nick:myNickName,msg:txt});
    input.value = "";
}

socket.on('chat message', (data)=>{
    addMsg(data.nick, data.msg, false);
})

sendBtn.onclick = sendMessage;
input.onkeydown = e=>{if(e.key==="Enter") sendMessage()}
</script>
</body>
</html>
